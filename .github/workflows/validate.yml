name: Validate
on:
  pull_request: {}
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  cache-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache-build
          key: ${{ runner.os }}-buildx-build-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-buildx-build-
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./containers/build
          cache-from: type=local,src=/tmp/.buildx-cache-build
          cache-to: type=local,dest=/tmp/.buildx-cache-build,mode=max
  cache-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache-validate
          key: ${{ runner.os }}-buildx-validate-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-buildx-validate-
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./containers/validate
          cache-from: type=local,src=/tmp/.buildx-cache-validate
          cache-to: type=local,dest=/tmp/.buildx-cache-validate,mode=max
  validate:
    needs: [cache-build, cache-validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache-build
          key: ${{ runner.os }}-buildx-build-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-buildx-build-
      - uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache-validate
          key: ${{ runner.os }}-buildx-validate-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-buildx-validate-
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./containers/build
          cache-from: type=local,src=/tmp/.buildx-cache-build
          cache-to: type=local,dest=/tmp/.buildx-cache-build,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: ./containers/validate
          cache-from: type=local,src=/tmp/.buildx-cache-validate
          cache-to: type=local,dest=/tmp/.buildx-cache-validate,mode=max
      - name: build json from yml
        run: docker compose run --rm build
      - name: validate json
        run: docker compose run --rm validate
