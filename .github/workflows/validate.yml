name: Validate
on:
  pull_request: {}
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('**/Dockerfile') }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ hashFiles('**/Dockerfile') }}-
            ${{ runner.os }}-buildx-
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./containers/build
          cache-from: type=local,src=/tmp/.buildx-cache/build
          cache-to: type=local,dest=/tmp/.buildx-cache-new/build,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./containers/validate
          cache-from: type=local,src=/tmp/.buildx-cache/validate
          cache-to: type=local,dest=/tmp/.buildx-cache-new/validate,mode=max
      - name: Build JSON from YML
        run: docker compose run --rm build
      - name: Validate JSON
        run: docker compose run --rm validate
      - name: Cleanup cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
